<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebP Converter</title>
  <link rel="stylesheet" href="node_modules/cropperjs/dist/cropper.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🖼️ WebP Converter</h1>
      <p>Convert JPG, PNG, HEIC, and WebP images to WebP format</p>
    </header>

    <div class="controls">
      <div class="quality-control">
        <label for="quality"><span id="quality-label">Quality</span>: <span id="quality-value">85</span></label>
        <input type="range" id="quality" min="1" max="100" value="85">
      </div>

      <div class="option-grid">
        <label class="field">
          <span>Max width (px)</span>
          <input type="number" id="max-width" min="1" step="1" placeholder="Original">
        </label>
        <label class="field">
          <span>Max height (px)</span>
          <input type="number" id="max-height" min="1" step="1" placeholder="Original">
        </label>
        <label class="field">
          <span>Target file size (KB)</span>
          <input type="number" id="target-kb" min="1" step="1" placeholder="None">
        </label>
      </div>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="batch" role="tab">Batch</button>
      <button class="tab" data-tab="crop" role="tab">Crop</button>
    </div>

    <section id="batch-panel" class="tab-panel">
      <div class="drop-zone" id="drop-zone">
        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <h3>Drag & Drop Images Here</h3>
        <p>or click to browse</p>
        <input type="file" id="file-input" multiple accept="image/jpeg,image/jpg,image/png,image/heic,image/heif,image/webp,.heic,.heif,.webp" hidden>
      </div>

      <div id="file-list"></div>

      <div class="button-row">
        <button id="convert-btn" class="convert-btn" disabled>Convert to WebP</button>
        <button id="clear-btn" class="clear-btn" style="display: none;">Clear Files</button>
      </div>

      <div id="results" class="results"></div>
    </section>

    <section id="crop-panel" class="tab-panel" hidden>
      <div class="drop-zone" id="crop-drop-zone">
        <h3>Drop One Image Here</h3>
        <p>or click to browse</p>
      </div>

      <div id="crop-editor" hidden>
        <div class="crop-toolbar">
          <span id="crop-file-name" class="file-name"></span>
          <label class="field inline">
            <span>Ratio</span>
            <select id="crop-ratio">
              <option value="NaN">Free</option>
              <option value="original">Original</option>
              <option value="1">1:1</option>
              <option value="1.3333333">4:3</option>
              <option value="1.5">3:2</option>
              <option value="1.7777778">16:9</option>
              <option value="0.75">3:4</option>
              <option value="0.6666667">2:3</option>
              <option value="0.5625">9:16</option>
            </select>
          </label>
          <label class="field inline">
            <span>Exact size</span>
            <input type="number" id="crop-exact-width" class="size-input" min="1" step="1" placeholder="Width">
            <span>&times;</span>
            <input type="number" id="crop-exact-height" class="size-input" min="1" step="1" placeholder="Height">
            <span>px</span>
          </label>
          <button id="crop-reset" class="small-btn">Reset box</button>
          <button id="crop-clear" class="small-btn">Clear</button>
        </div>
        <p class="crop-hint" id="crop-hint" hidden>Exact size is set: the ratio is locked to it, and Max width/height are ignored on this tab.</p>

        <div class="crop-compare">
          <div class="crop-pane">
            <div class="pane-label">Original: drag to crop</div>
            <div class="crop-stage"><img id="crop-image" alt=""></div>
          </div>
          <div class="crop-pane">
            <div class="pane-label">
              Result preview
              <label class="actual-size"><input type="checkbox" id="crop-actual-size"> Actual size</label>
            </div>
            <div class="result-stage" id="crop-result-stage"><img id="crop-result" alt=""></div>
          </div>
        </div>

        <div id="crop-info" class="crop-info"></div>

        <div class="button-row">
          <button id="crop-save" class="convert-btn" disabled>Save as WebP</button>
        </div>
        <div id="crop-status" class="results"></div>
      </div>
    </section>
  </div>

  <script src="node_modules/cropperjs/dist/cropper.min.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
